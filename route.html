<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan HD Map - Road Route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<style>
body{margin:0;font-family:sans-serif}
#map{height:85vh;width:100%}
.top{padding:10px;background:#fff;display:flex;gap:5px;flex-wrap:wrap}
input{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;min-width:120px}
button{padding:10px 15px;background:#000;color:#fff;border:none;border-radius:8px;font-weight:bold}
.info{padding:5px 10px;font-size:14px;background:#f0f0f0}
</style>
</head>
<body>
<div class="top">
<input id="from" value="Saddar, Karachi, Pakistan" placeholder="From">
<input id="to" value="Lahore, Pakistan" placeholder="To">
<button onclick="showRoute()">Show Road Route</button>
</div>
<div class="info" id="info">Click Show Road Route to see Uber/Careem style route</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script>
var map = L.map('map').setView([30.3753, 69.3451], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19, attribution:'© OpenStreetMap'
}).addTo(map);

var control = null;

function showRoute(){
var fromText = document.getElementById('from').value;
var toText = document.getElementById('to').value;

if(control){ map.removeControl(control); }

document.getElementById('info').innerHTML = "Loading route from "+fromText+" to "+toText+"...";

// Use OSRM free routing with geocoding via Nominatim
Promise.all([
fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(fromText)).then(r=>r.json()),
fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(toText)).then(r=>r.json())
]).then(results=>{
var from = results[0][0];
var to = results[1][0];
if(!from || !to){ document.getElementById('info').innerHTML="Location not found! Try again"; return; }

var fromLatLng = L.latLng(from.lat, from.lon);
var toLatLng = L.latLng(to.lat, to.lon);

control = L.Routing.control({
waypoints: [fromLatLng, toLatLng],
router: L.Routing.osrmv1({serviceUrl: 'https://router.project-osrm.org/route/v1'}),
lineOptions: {styles:[{color:'black', weight:8, opacity:0.8},{color:'#00bfff', weight:5, opacity:1}]},
createMarker: function(i, wp, nWps){ return L.marker(wp.latLng).bindPopup(i==0 ? fromText : toText); }
}).on('routesfound', function(e){
var r = e.routes[0];
var km = (r.summary.totalDistance/1000).toFixed(1);
var min = Math.round(r.summary.totalTime/60);
document.getElementById('info').innerHTML = "Distance: "+km+" KM | Time: "+min+" min | Route: "+fromText+" to "+toText;
map.fitBounds(L.latLngBounds([fromLatLng, toLatLng]));
}).addTo(map);

}).catch(err=>{
document.getElementById('info').innerHTML="Error: "+err.message;
});
}

// Auto load on start
window.onload = showRoute;
</script>
</body>
</html>
