<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route 1 - Simple</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>body{margin:0} #map{height:100vh; width:100%} </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([24.86, 67.03], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
// Saddar to Clifton fixed route
fetch('https://router.project-osrm.org/route/v1/driving/67.0331,24.8615;67.0359,24.8138?overview=full&geometries=geojson')
.then(r=>r.json()).then(d=>{
  const line = L.geoJSON(d.routes[0].geometry,{color:'#1a73e8',weight:6}).addTo(map);
  map.fitBounds(line.getBounds(),{padding:[20,20]});
});
</script>
</body>
</html>
