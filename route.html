<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan Road Route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f5}
header{background:#07883d;color:white;text-align:center;padding:15px;font-size:20px;font-weight:bold}
.panel{background:white;padding:12px}
input{width:100%;padding:12px;margin:6px 0 10px;border:1px solid #aaa;border-radius:7px;font-size:15px}
button{width:100%;padding:13px;background:#07883d;color:white;border:0;border-radius:7px;font-size:16px;font-weight:bold;cursor:pointer}
#result{padding:10px;font-size:14px;min-height:25px}
#map{height:60vh;width:100%}
a.link{display:block;text-align:center;margin:8px;color:#07883d;font-size:14px}
</style>
</head>
<body>
<header>Pakistan Road Route</header>
<div class="panel">
<label>From - Kahan se?</label>
<input id="from" value="Saddar, Karachi, Pakistan">
<label>To - Kahan jana hai?</label>
<input id="to" value="Lahore, Pakistan">
<button onclick="showRoute()" id="btn">Show Road Route</button>
<div id="result">Button dabayein - Road Route ayega</div>
<a class="link" href="./index.html">← Back to HD Map</a>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([30.3,69.3],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let line=null;
async function find(q){
 let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pk&q='+encodeURIComponent(q));
 let d=await r.json();
 if(!d.length) throw Error('Jagah nahi mili: '+q);
 return {lat:+d[0].lat, lon:+d[0].lon, name:d[0].display_name};
}
async function showRoute(){
 let btn=document.getElementById('btn');
 let res=document.getElementById('result');
 res.textContent='Route dhoondh rahe hain...';
 btn.disabled=true;
 try{
  let a=await find(document.getElementById('from').value);
  let b=await find(document.getElementById('to').value);
  let url=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`;
  let r2=await fetch(url);
  let data=await r2.json();
  if(!data.routes || !data.routes.length) throw Error('Route nahi mila');
  let route=data.routes[0];
  let coords=route.geometry.coordinates.map(c=>[c[1],c[0]]);
  if(line) map.removeLayer(line);
  line=L.polyline(coords,{color:'#07883d',weight:6}).addTo(map);
  L.marker([a.lat,a.lon]).addTo(map).bindPopup('From: '+a.name);
  L.marker([b.lat,b.lon]).addTo(map).bindPopup('To: '+b.name);
  map.fitBounds(line.getBounds(),{padding:[30,30]});
  let km=(route.distance/1000).toFixed(1);
  let min=Math.round(route.duration/60);
  res.textContent=`✅ Distance: ${km} km | Time: ${min} min`;
 }catch(e){
  res.textContent='❌ '+e.message;
 }finally{btn.disabled=false;}
}
</script>
</body>
</html>
