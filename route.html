<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan Road Route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f5}
header{background:#07883d;color:white;text-align:center;padding:15px;font-size:23px;font-weight:bold}
.panel{background:white;padding:12px}
input{width:100%;padding:12px;margin:5px 0 10px;border:1px solid #aaa;border-radius:7px;font-size:16px}
button{width:100%;padding:13px;background:#07883d;color:white;border:0;border-radius:7px;font-size:16px;font-weight:bold}
#result{padding:10px;font-size:15px;line-height:1.6}
#map{height:55vh;min-height:330px;width:100%}
</style>
</head>
<body>
<header>Pakistan Road Route</header>
<div class="panel">
<label>From - Shuru kahan se karna hai?</label>
<input id="from" value="Saddar, Karachi, Pakistan">
<label>To - Kahan jana hai?</label>
<input id="to" value="Lahore, Pakistan">
<button id="routeButton">Show Road Route</button>
<div id="result"></div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{maxBounds:[[23,60],[37.8,78.5]],maxBoundsViscosity:0.8}).setView([30.3753,69.3451],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let routeLine=null,startMarker=null,endMarker=null,busy=false;
function message(t){document.getElementById('result').textContent=t;}
async function findLocation(name){
const url='https://nominatim.openstreetmap.org/search?format=json&countrycodes=pk&limit=1&q='+encodeURIComponent(name);
const r=await fetch(url); const d=await r.json(); if(!d.length) throw Error('Not found');
return {lat:+d[0].lat,lon:+d[0].lon,name:d[0].display_name};
}
async function showRoute(){
if(busy)return; busy=true;
const btn=document.getElementById('routeButton'); btn.disabled=true; btn.textContent='Route dhoondh rahe hain...';
try{
const a=await findLocation(document.getElementById('from').value);
const b=await findLocation(document.getElementById('to').value);
const url='https://router.project-osrm.org/route/v1/driving/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=full&geometries=geojson';
const r=await fetch(url); const data=await r.json();
const route=data.routes[0];
const coords=route.geometry.coordinates.map(p=>[p[1],p[0]]);
if(routeLine)map.removeLayer(routeLine); if(startMarker)map.removeLayer(startMarker); if(endMarker)map.removeLayer(endMarker);
routeLine=L.polyline(coords,{color:'#07883d',weight:5}).addTo(map);
startMarker=L.marker([a.lat,a.lon]).addTo(map).bindPopup(a.name);
endMarker=L.marker([b.lat,b.lon]).addTo(map).bindPopup(b.name);
map.fitBounds(routeLine.getBounds(),{padding:[30,30]});
message('Distance: '+(route.distance/1000).toFixed(1)+' km | Time: '+Math.round(route.duration/60)+' minute');
}catch(e){message('Route nahi mila - internet / naam check karein');}
finally{busy=false; btn.disabled=false; btn.textContent='Show Road Route';}
}
document.getElementById('routeButton').addEventListener('click',showRoute);
</script>
</body>
</html>
