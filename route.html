<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan Road Route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f5}
header{background:#07883d;color:white;text-align:center;padding:15px;font-size:23px;font-weight:bold}
.panel{background:white;padding:12px}
input{width:100%;padding:12px;margin:5px 0 10px;border:1px solid #aaa;border-radius:7px;font-size:16px}
button{width:100%;padding:13px;background:#07883d;color:white;border:0;border-radius:7px;font-size:16px;font-weight:bold;cursor:pointer}
#result{padding:10px;font-size:15px;line-height:1.6;min-height:30px}
#map{height:55vh;min-height:350px;width:100%}
a.back{display:block;text-align:center;margin-top:10px;color:#07883d;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<header>Pakistan Road Route</header>
<div class="panel">
<label>From - Shuru kahan se karna hai?</label>
<input id="from" value="Saddar, Karachi, Pakistan">
<label>To - Kahan jana hai?</label>
<input id="to" value="Lahore, Pakistan">
<button id="routeButton" type="button">Show Road Route</button>
<div id="result">Button dabao - Road Route ayega</div>
<a class="back" href="./index.html">← Back to HD Map</a>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{maxBounds:[[23,60],[37.8,78.5]],maxBoundsViscosity:0.8}).setView([30.3753,69.3451],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let routeLine=null,startMarker=null,endMarker=null,busy=false;
function message(t){document.getElementById('result').textContent=t;}
async function findLocation(name){
const url='https://nominatim.openstreetmap.org/search?format=json&countrycodes=pk&limit=1&q='+encodeURIComponent(name);
const r=await fetch(url); if(!r.ok) throw Error('Search failed');
const d=await r.json(); if(!d.length) throw Error('Location nahi mili: '+name);
const p=d[0]; return {lat:Number(p.lat),lon:Number(p.lon),name:p.display_name};
}
async function showRoute(){
if(busy) return;
const from=document.getElementById('from').value.trim();
const to=document.getElementById('to').value.trim();
if(!from||!to) return;
busy=true;
const btn=document.getElementById('routeButton');
btn.disabled=true; btn.textContent='Route dhoondh rahe hain...';
message('Location search ho raha hai...');
try{
const a=await findLocation(from);
const b=await findLocation(to);
const url='https://router.project-osrm.org/route/v1/driving/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=full&geometries=geojson';
const res=await fetch(url); if(!res.ok) throw Error('Route service band hai');
const data=await res.json();
if(data.code!=='Ok'||!data.routes.length) throw Error('Driving route nahi mila');
const route=data.routes[0];
const coords=route.geometry.coordinates.map(p=>[p[1],p[0]]);
if(routeLine) map.removeLayer(routeLine);
if(startMarker) map.removeLayer(startMarker);
if(endMarker) map.removeLayer(endMarker);
routeLine=L.polyline(coords,{color:'#07883d',weight:6}).addTo(map);
startMarker=L.marker([a.lat,a.lon]).addTo(map).bindPopup('From: '+a.name);
endMarker=L.marker([b.lat,b.lon]).addTo(map).bindPopup('To: '+b.name);
map.fitBounds(routeLine.getBounds(),{padding:[30,30]});
const km=(route.distance/1000).toFixed(1);
const mins=Math.round(route.duration/60);
const h=Math.floor(mins/60), m=mins%60;
const time=h>0? h+' ghante '+m+' min' : m+' min';
message('✅ Distance: '+km+' km | Time: '+time);
}catch(e){ message('❌ '+e.message); }
finally{ busy=false; btn.disabled=false; btn.textContent='Show Road Route'; }
}
document.getElementById('routeButton').addEventListener('click', showRoute);
</script>
</body>
</html>
