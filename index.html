<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan hd.map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial}
#map{height:100vh;width:100%}
#top{position:absolute;top:0;left:0;right:0;z-index:1000;background:#1a73e8;color:white;text-align:center;padding:12px;font-weight:bold;font-size:15px}
#search{position:absolute;top:50px;left:10px;right:10px;z-index:1000;background:white;border-radius:24px;display:flex;align-items:center;padding:4px 4px 4px 10px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#search input{flex:1;border:0;outline:0;font-size:15px;padding:10px;background:transparent}
#search button{border:0;background:#1a73e8;color:white;width:40px;height:40px;border-radius:50%}
#type{position:absolute;top:108px;left:10px;z-index:1000;background:white;border-radius:8px;display:flex;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#type button{border:0;background:white;padding:9px 16px;font-weight:bold;font-size:13px}
#type button.active{background:#1a73e8;color:white}
#btns{position:absolute;right:12px;bottom:20px;z-index:1000;display:flex;flex-direction:column;gap:10px}
#btns button{width:44px;height:44px;border-radius:10px;border:0;background:white;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:18px}
#gps{background:#1a73e8!important;color:white}
#dist{position:absolute;left:10px;bottom:20px;z-index:1000;background:white;padding:10px 14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:13px;font-weight:bold;max-width:75%;display:none}
</style>
</head>
<body>
<div id="top">Pakistan hd.map</div>

<div id="search">
<input id="q" placeholder="">
<button onclick="talash()">🔍</button>
</div>

<div id="type">
<button id="roadB" class="active" onclick="badlo('road')">Map</button>
<button id="satB" onclick="badlo('sat')">Satellite</button>
</div>

<div id="btns">
<button onclick="setGhar()" title="Ghar set karo">🏠</button>
<button id="gps" onclick="gps()">📍</button>
</div>

<div id="dist"></div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PAK=[30.3753,69.3451];
const BOUNDS=L.latLngBounds([23.4,60.4],[37.3,78.0]);
const map=L.map('map',{center:PAK,zoom:6,minZoom:6,maxZoom:22,maxBounds:BOUNDS,maxBoundsViscosity:1.0,attributionControl:false});

const road=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,maxNativeZoom:19});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22,maxNativeZoom:19});

road.addTo(map);
let cur=road; let pin, myPin, myCircle; let gharPos=null; let gharMarker=null;

function badlo(t){
  map.removeLayer(cur);
  document.getElementById('roadB').classList.remove('active');
  document.getElementById('satB').classList.remove('active');
  if(t=='road'){cur=road; document.getElementById('roadB').classList.add('active');}
  else{cur=sat; document.getElementById('satB').classList.add('active');}
  map.addLayer(cur);
}

function setGhar(){
  navigator.geolocation.getCurrentPosition(p=>{
    gharPos=[p.coords.latitude,p.coords.longitude];
    if(gharMarker) map.removeLayer(gharMarker);
    gharMarker=L.marker(gharPos,{icon:L.divIcon({html:'🏠',className:'',iconSize:[30,30]})}).addTo(map).bindPopup('Tumhara Ghar set ho gaya').openPopup();
    map.setView(gharPos,16);
    document.getElementById('dist').style.display='block';
    document.getElementById('dist').innerHTML='🏠 Ghar set ho gaya - Ab Lahore search karo, fasla batayega';
  },()=>{
    alert('Ghar set karne ke liye Location ON karo aur Allow dabao');
  },{enableHighAccuracy:true});
}

function calcDistance(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}

async function talash(){
  let q=document.getElementById('q').value.trim(); if(!q) return;
  let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&countrycodes=pk&limit=1`);
  let d=await r.json(); if(!d.length){alert('Nahi mila'); return;}
  let ll=[Number(d[0].lat),Number(d[0].lon)];
  if(pin) map.removeLayer(pin);
  pin=L.marker(ll).addTo(map).openPopup();
  map.setView(ll,14);
  
  if(gharPos){
    let km=calcDistance(gharPos[0],gharPos[1],ll[0],ll[1]);
    let box=document.getElementById('dist');
    box.style.display='block';
    if(km<1) box.innerHTML=`📍 ${d[0].display_name.split(',')[0]}<br>🏠 Ghar se fasla: ${Math.round(km*1000)} meter door`;
    else box.innerHTML=`📍 ${d[0].display_name.split(',')[0]}<br>🏠 Ghar se fasla: ${km.toFixed(1)} KM door`;
  } else {
    let box=document.getElementById('dist');
    box.style.display='block';
    box.innerHTML=`📍 ${d[0].display_name.split(',')[0]}<br>🏠 Pehle GPS ya Home dabao taake fasla bataye`;
  }
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key=='Enter') talash();});

function gps(){
  navigator.geolocation.getCurrentPosition(p=>{
    let ll=[p.coords.latitude,p.coords.longitude];
    if(!gharPos){ gharPos=ll; }
    if(myPin) map.removeLayer(myPin); if(myCircle) map.removeLayer(myCircle);
    myCircle=L.circle(ll,{radius:p.coords.accuracy,color:'#1a73e8',fillOpacity:0.15}).addTo(map);
    myPin=L.marker(ll).addTo(map).bindPopup('Tumhari location').openPopup();
    map.setView(ll,16);
  },()=>{alert('Location ON karo');},{enableHighAccuracy:true});
}
</script>
</body>
</html>
