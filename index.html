
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pakistan HD Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial}
#map{height:100dvh;width:100vw}
.header{position:absolute;top:0;left:0;right:0;z-index:1000;background:#087a42;color:white;text-align:center;padding:14px;font-weight:bold}
.controls{position:absolute;top:65px;right:10px;z-index:1000;display:flex;flex-direction:column;gap:8px}
button{background:white;border:0;padding:12px;border-radius:9px;font-weight:bold;box-shadow:0 2px 8px #777}
</style>
</head>
<body>
<div class="header">Pakistan Ka Asli Live Map</div>
<div id="map"></div>
<div class="controls">
<button onclick="toggleMap()">🛰️ Satellite / Road</button>
<button onclick="gps()">📍 Meri Live Location</button>
<button onclick="pakistan()">🇵🇰 Pakistan Map</button>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([30.3753,69.3451],6);
const road=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});
let isSat=false,marker=null,circle=null;
function toggleMap(){
if(isSat){map.removeLayer(sat);road.addTo(map);}
else{map.removeLayer(road);sat.addTo(map);}
isSat=!isSat;
}
function pakistan(){map.setView([30.3753,69.3451],6);}
function gps(){
if(!navigator.geolocation){alert('GPS support nahi hai');return;}
navigator.geolocation.getCurrentPosition(p=>{
const pos=[p.coords.latitude,p.coords.longitude];
map.setView(pos,17);
if(marker)map.removeLayer(marker);
if(circle)map.removeLayer(circle);
marker=L.marker(pos).addTo(map).bindPopup('Aapki GPS Location').openPopup();
circle=L.circle(pos,{radius:p.coords.accuracy,color:'#087a42',fillOpacity:.12}).addTo(map);
},()=>alert('GPS on karein aur location permission allow karein.'),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
</script>
</body>
</html>
