<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pakistan HD Map - Asli GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
#map{height:100vh;width:100vw}
#top{position:absolute;top:0;left:0;right:0;z-index:1000;background:#0d7a2e;color:white;text-align:center;padding:14px;font-weight:bold;font-size:16px}
#search{position:absolute;top:60px;left:10px;right:115px;z-index:1000;background:white;border-radius:25px;display:flex;padding:4px 12px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#search input{flex:1;border:none;outline:none;padding:10px;font-size:14px}
#search button{border:none;background:#0d7a2e;color:white;width:36px;height:36px;border-radius:50%}
.btns{position:absolute;top:60px;right:8px;z-index:1000;display:flex;flex-direction:column;gap:7px}
.btns button{padding:11px 15px;border:none;border-radius:22px;background:white;font-weight:bold;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.btns button.active{background:#0d7a2e;color:white}
#gps{position:absolute;bottom:25px;right:15px;z-index:1000;width:62px;height:62px;border-radius:50%;border:none;background:#0d7a2e;color:white;font-size:30px;box-shadow:0 4px 15px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div id="top">🇵🇰 PAKISTAN KA FULL HD MAP - ASLI GPS + GALIYAN SAAF</div>

<div id="search">
<input id="q" type="text" placeholder="Karachi, Lahore search karo...">
<button onclick="searchKaro()">🔍</button>
</div>

<div class="btns">
<button id="bt1" class="active" onclick="layerBadlo('road')">Road / Galiyan</button>
<button id="bt2" onclick="layerBadlo('sat')">HD Satellite</button>
<button id="bt3" onclick="layerBadlo('hybrid')">Satellite + Naam</button>
</div>

<button id="gps" onclick="asliLocation()">📍</button>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// PAKISTAN CENTER
var PAK = [30.3753, 69.3451];
var PAK_BOUNDS = [[23.5, 60.5], [37.5, 80.0]];

// HD LAYERS
var roadLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:19});
var satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:19});
var nameLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{maxZoom:20});
var hybridLayer = L.layerGroup([satLayer, nameLayer]);

// MAP - Sirf Pakistan
var map = L.map('map',{
center: PAK,
zoom: 6,
layers: [roadLayer],
zoomControl: false,
maxBounds: PAK_BOUNDS,
maxBoundsViscosity: 1.0
});
L.control.zoom({position:'topleft'}).addTo(map);

var current = roadLayer;
function layerBadlo(type){
  map.removeLayer(current);
  document.getElementById('bt1').classList.remove('active');
  document.getElementById('bt2').classList.remove('active');
  document.getElementById('bt3').classList.remove('active');
  if(type=='road'){ current = roadLayer; document.getElementById('bt1').classList.add('active'); }
  if(type=='sat'){ current = satLayer; document.getElementById('bt2').classList.add('active'); }
  if(type=='hybrid'){ current = hybridLayer; document.getElementById('bt3').classList.add('active'); }
  map.addLayer(current);
}

// ASLI LIVE GPS - Koi Farzi Nishan Nahi
var liveM, liveC;
function asliLocation(){
  if(!navigator.geolocation){ alert("Is mobile me GPS nahi hai"); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    var ll = [pos.coords.latitude, pos.coords.longitude];
    if(liveM) map.removeLayer(liveM);
    if(liveC) map.removeLayer(liveC);
    liveC = L.circle(ll,{radius:pos.coords.accuracy,color:'#0d7a2e',fillOpacity:0.15}).addTo(map);
    liveM = L.marker(ll).addTo(map).bindPopup("<b>📍 Tumhari Asli Location</b><br>Accuracy: "+Math.round(pos.coords.accuracy)+" meter").openPopup();
    map.setView(ll, 18);
  }, function(err){
    alert("Bhai Location ON karo aur Allow dabao");
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}

// SEARCH - Sirf Pakistan me
async function searchKaro(){
  var val = document.getElementById('q').value;
  if(!val) return;
  var url = `https://nominatim.openstreetmap.org/search?format=json&q=${val}&countrycodes=pk&limit=1`;
  var r = await fetch(url);
  var d = await r.json();
  if(d.length>0){
    var lat = d[0].lat, lon = d[0].lon;
    map.setView([lat,lon], 15);
    L.marker([lat,lon]).addTo(map).bindPopup(d[0].display_name).openPopup();
  } else {
    alert("Jagah nahi mili, dosra naam likho");
  }
}
</script>
</body>
</html>
