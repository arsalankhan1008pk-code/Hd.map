
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan HD Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff}
header{background:#07883d;color:white;text-align:center;padding:14px;font-size:23px;font-weight:bold}
.search{display:flex;gap:6px;padding:8px}
input{flex:1;min-width:0;width:100%;padding:11px;border:1px solid #aaa;border-radius:7px;font-size:14px}
button{padding:10px;background:#07883d;color:white;border:0;border-radius:7px;font-size:14px;cursor:pointer}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:0 8px 8px}
.tools button{flex:1;min-width:100px}
#map{height:58dvh;min-height:300px;width:100%;background:#e8eee8}
#status{font-size:12px;padding:8px;color:#333}
</style>
</head>
<body>
<header>Pakistan HD Map</header>

<div class="search">
<input id="search" placeholder="Shehar ya jagah search karein">
<button onclick="findPlace()">Search</button>
</div>

<div class="search">
<input id="from" placeholder="Route kahan se?">
<input id="to" placeholder="Manzil kahan hai?">
<button onclick="makeRoute()">Route</button>
</div>

<div class="tools">
<button onclick="getLocation()">📍 My Location</button>
<button onclick="openStreetView()">🌍 Street View</button>
<button onclick="clearRoute()">Clear Route</button>
</div>

<div id="map"></div>
<div id="status">Pakistan HD Map | Search, GPS, Satellite aur Route</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{
zoomControl:true,
maxBounds:[[23.0,60.0],[37.8,78.5]],
maxBoundsViscosity:0.8
}).setView([30.3753,69.3451],5);

const normalMap=L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}
).addTo(map);

const satelliteMap=L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:19,attribution:'Tiles &copy; Esri'}
);

L.control.layers({
'Normal Road Map':normalMap,
'Satellite View':satelliteMap
},null,{position:'topright',collapsed:false}).addTo(map);

let gpsMarker=null;
let searchMarker=null;
let routeLine=null;
let selectedPoint=null;
let gpsPoint=null;

function status(msg){
document.getElementById('status').textContent=msg;
}

function inPakistan(lat,lon){
return lat>=23.5&&lat<=37.2&&lon>=60.8&&lon<=77.9;
}

async function geocode(q){
const url='https://nominatim.openstreetmap.org/search?format=json&countrycodes=pk&limit=5&q='+encodeURIComponent(q);
const res=await fetch(url);
if(!res.ok)throw Error('Search service unavailable');
const results=await res.json();
return results.find(p=>inPakistan(Number(p.lat),Number(p.lon)));
}

async function findPlace(){
const q=document.getElementById('search').value.trim();
if(!q){alert('Shehar ya jagah ka naam likhein.');return;}
status('Jagah search ho rahi hai...');
try{
const p=await geocode(q);
if(!p){status('Pakistan mein jagah nahi mili. Doosra naam try karein.');return;}
const point=[Number(p.lat),Number(p.lon)];
selectedPoint=point;
if(searchMarker)map.removeLayer(searchMarker);
searchMarker=L.marker(point).addTo(map)
.bindPopup(p.display_name).openPopup();
map.setView(point,15);
status('Search result: '+p.display_name);
}catch(e){
status('Internet check karein aur dobara search karein.');
}
}

document.getElementById('search').addEventListener('keydown',e=>{
if(e.key==='Enter')findPlace();
});

function getLocation(){
if(!navigator.geolocation){
status('Browser GPS support nahi karta.');
return;
}
status('GPS location mil rahi hai...');
navigator.geolocation.getCurrentPosition(pos=>{
const lat=pos.coords.latitude;
const lon=pos.coords.longitude;
if(!inPakistan(lat,lon)){
status('GPS location Pakistan map ki hudood se bahar hai.');
return;
}
gpsPoint=[lat,lon];
if(gpsMarker)map.removeLayer(gpsMarker);
gpsMarker=L.marker(gpsPoint).addTo(map)
.bindPopup('Aapki GPS location').openPopup();
map.setView(gpsPoint,16);
status('GPS location mil gayi.');
},()=>{
status('GPS nahi mila. Browser ki Location permission on karein.');
},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}

function openStreetView(){
const p=selectedPoint||gpsPoint;
if(!p){
alert('Pehle koi jagah search karein ya My Location dabayein.');
return;
}
const url='https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+p[0]+','+p[1];
window.open(url,'_blank');
}

async function makeRoute(){
const a=document.getElementById('from').value.trim();
const b=document.getElementById('to').value.trim();
if(!a||!b){
alert('Route ke liye shuru ki jagah aur manzil dono likhein.');
return;
}
status('Dono jagah search ho rahi hain...');
try{
const start=await geocode(a);
const end=await geocode(b);
if(!start||!end){
status('Jagah nahi mili. Dono jagahon ke naam check karein.');
return;
}
const p1=[Number(start.lat),Number(start.lon)];
const p2=[Number(end.lat),Number(end.lon)];
status('Route ban raha hai...');
const url='https://router.project-osrm.org/route/v1/driving/'+
p1[1]+','+p1[0]+';'+p2[1]+','+p2[0]+
'?overview=full&geometries=geojson';
const res=await fetch(url);
if(!res.ok)throw Error('Route service unavailable');
const data=await res.json();
if(data.code!=='Ok'||!data.routes.length){
status('Is route ka raasta nahi mila.');
return;
}
if(routeLine)map.removeLayer(routeLine);
routeLine=L.geoJSON(data.routes[0].geometry,{
style:{color:'#0878ff',weight:5,opacity:0.85}
}).addTo(map);
L.marker(p1).addTo(map).bindPopup('Shuru: '+start.display_name);
L.marker(p2).addTo(map).bindPopup('Manzil: '+end.display_name);
map.fitBounds(routeLine.getBounds(),{padding:[25,25]});
const km=(data.routes[0].distance/1000).toFixed(1);
const mins=Math.round(data.routes[0].duration/60);
status='Road distance: '+km+' km | Andazati driving time: '+mins+' minutes';
}catch(e){
status('Route nahi ban saka. Internet check karke dobara koshish karein.');
}
}

function clearRoute(){
if(routeLine)map.removeLayer(routeLine);
routeLine=null;
status('Route clear kar diya gaya.');
}
</script>
</body>
</html>
