<!DOCTYPE html>
<html>
<head>
<title>Pakistan hd.map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>html,body,#map{height:100%;margin:0;padding:0} .top{position:absolute;top:0;width:100%;z-index:1000;background:#1976d2;color:white;text-align:center;padding:8px;font-weight:bold}</style>
</head>
<body>
<div class="top">Pakistan hd.map</div>
<div id="map"></div>
<script>
var map = L.map('map', {
  zoomControl:false,
  minZoom:3,
  maxZoom:20
}).setView([24.8607, 67.0011], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map).setOpacity(0);

var userMarker=null, accCircle=null;
var firstFix=true;

function onLocationFound(e){
  var radius = e.accuracy;
  if(!userMarker){
    userMarker = L.marker(e.latlng).addTo(map);
    accCircle = L.circle(e.latlng, radius).addTo(map);
  } else {
    userMarker.setLatLng(e.latlng);
    accCircle.setLatLng(e.latlng).setRadius(radius);
  }
  if(firstFix){
    map.setView(e.latlng, 16);
    firstFix=false;
  }
}

map.on('locationfound', onLocationFound);
map.locate({watch:true, enableHighAccuracy:true, setView:false, maxZoom:16});

// Buttons
function zoomIn(){ map.zoomIn(); }
function zoomOut(){ map.zoomOut(); }
</script>
<div style="position:absolute;bottom:20px;left:10px;z-index:1000">
<button onclick="zoomIn()" style="display:block;width:35px;height:35px;font-size:20px">+</button>
<button onclick="zoomOut()" style="display:block;width:35px;height:35px;font-size:20px">-</button>
</div>
</body>
</html>
