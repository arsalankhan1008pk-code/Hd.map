<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pakistan hd.map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;touch-action:none}
#map{height:100vh;width:100%;z-index:1}
#top{
position:absolute;top:0;left:0;right:0;z-index:1000;
background:#1a73e8;color:white;text-align:center;
padding:12px;font-weight:bold;font-size:15px
}
#search{
position:absolute;top:48px;left:10px;right:10px;z-index:1000;
background:white;border-radius:24px;display:flex;
align-items:center;padding:4px 4px 4px 12px;
box-shadow:0 2px 10px rgba(0,0,0,.35)
}
#search input{
flex:1;border:0;outline:0;font-size:15px;
padding:10px;background:transparent
}
#search button{
border:0;background:#1a73e8;color:white;
width:40px;height:40px;border-radius:50%
}
#type{
position:absolute;top:106px;left:10px;z-index:1000;
background:white;border-radius:8px;display:flex;
overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.3)
}
#type button{
border:0;background:white;padding:9px 16px;
font-weight:bold;font-size:13px
}
#type button.active{background:#1a73e8;color:white}
#btns{
position:absolute;right:12px;bottom:18px;z-index:1000;
display:flex;flex-direction:column;gap:8px
}
#btns button{
width:46px;height:46px;border-radius:12px;border:0;
background:white;box-shadow:0 2px 10px rgba(0,0,0,.35);
font-size:20px;font-weight:bold
}
#gps{background:#1a73e8!important;color:white}
#zoom{
position:absolute;left:12px;bottom:18px;z-index:1000;
display:flex;flex-direction:column;gap:0;
background:white;border-radius:12px;overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.35)
}
#zoom button{
width:44px;height:44px;border:0;background:white;
font-size:24px;font-weight:bold;
border-bottom:1px solid #ddd
}
#zoom button:last-child{border-bottom:0}
</style>
</head>
<body>

<div id="top">Pakistan hd.map</div>

<div id="search">
<input id="q" placeholder="">
<button onclick="talash()">🔍</button>
</div>

<div id="type">
<button id="roadB" class="active" onclick="badlo('road')">Map</button>
<button id="satB" onclick="badlo('sat')">Satellite</button>
</div>

<div id="zoom">
<button onclick="map.zoomIn()">+</button>
<button onclick="map.zoomOut()">−</button>
</div>

<div id="btns">
<button onclick="map.setView([30.3753,69.3451],6)">🏠</button>
<button id="gps" onclick="liveGPS()">📍</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PAK=[30.3753,69.3451];
const BOUNDS=L.latLngBounds([23.4,60.4],[37.3,78.0]);
const map=L.map('map',{
center:PAK,zoom:6,minZoom:5,maxZoom:22,
maxBounds:BOUNDS,
maxBoundsViscosity:0.5,
zoomControl:false,
attributionControl:false,
dragging:true,
touchZoom:true,
doubleClickZoom:true,
scrollWheelZoom:true,
boxZoom:true,
keyboard:true,
bounceAtZoomLimits:false
});

const road=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:22,maxNativeZoom:19
});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
maxZoom:22,maxNativeZoom:19
});

road.addTo(map);
setTimeout(()=>{map.invalidateSize();},200);

let cur=road;
let pin,myPin,myCircle;
let watchId=null;
let liveOn=false;

function badlo(t){
map.removeLayer(cur);
document.getElementById('roadB').classList.remove('active');
document.getElementById('satB').classList.remove('active');
if(t=='road'){
cur=road;
document.getElementById('roadB').classList.add('active');
} else {
cur=sat;
document.getElementById('satB').classList.add('active');
}
map.addLayer(cur);
}

async function talash(){
let q=document.getElementById('q').value.trim();
if(!q) return;
let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&countrycodes=pk&limit=1`);
let d=await r.json();
if(!d.length) return;
let ll=[Number(d[0].lat),Number(d[0].lon)];
if(pin) map.removeLayer(pin);
pin=L.marker(ll).addTo(map);
map.setView(ll,14);
}

document.getElementById('q').addEventListener('keydown',e=>{
if(e.key=='Enter') talash();
});

function liveGPS(){
if(liveOn){
if(watchId!==null) navigator.geolocation.clearWatch(watchId);
liveOn=false;
document.getElementById('gps').style.background='#1a73e8';
return;
}
if(!navigator.geolocation){
alert('GPS support nahi hai');
return;
}
liveOn=true;
document.getElementById('gps').style.background='red';
watchId=navigator.geolocation.watchPosition(p=>{
let ll=[p.coords.latitude,p.coords.longitude];
if(myPin) map.removeLayer(myPin);
if(myCircle) map.removeLayer(myCircle);
myCircle=L.circle(ll,{radius:p.coords.accuracy,color:'#1a73e8',fillOpacity:0.15}).addTo(map);
myPin=L.marker(ll).addTo(map);
map.setView(ll,18);
},()=>{
alert('Location ON karo');
liveOn=false;
document.getElementById('gps').style.background='#1a73e8';
},{
enableHighAccuracy:true,
maximumAge:0,
timeout:10000
});
}
</script>
</body>
</html>
