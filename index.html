
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan HD Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif}
header{background:#07883d;color:white;text-align:center;padding:14px;font-size:23px;font-weight:bold}
.search{display:flex;gap:7px;padding:10px;background:#fff}
input{flex:1;min-width:0;padding:12px;border:1px solid #aaa;border-radius:7px;font-size:15px}
button{padding:11px;background:#07883d;color:white;border:0;border-radius:7px;font-size:15px}
#map{height:calc(100dvh - 125px);width:100%;background:#e8eee8}
#status{font-size:12px;padding:5px 10px;color:#333}
</style>
</head>
<body>
<header>Pakistan HD Map</header>
<div class="search">
<input id="search" placeholder="Shehar ya jagah search karein">
<button onclick="findPlace()">Search</button>
</div>
<div id="map"></div>
<div id="status">Pakistan map | GPS ke liye Location button dabayein</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const pakistan=[
[23.5,60.8],[37.2,60.8],
[37.2,77.9],[23.5,77.9]
];
const map=L.map('map',{
zoomControl:true,
maxBounds:[[23.0,60.0],[37.8,78.5]],
maxBoundsViscosity:0.8
}).setView([30.3753,69.3451],5);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'&copy; OpenStreetMap contributors'
}
).addTo(map);

let gpsMarker=null;
let searchMarker=null;

const gpsIcon=L.divIcon({
className:'',
html:'<div style="width:18px;height:18px;background:#1677ff;border:4px solid white;border-radius:50%;box-shadow:0 0 8px #555"></div>',
iconSize:[18,18],
iconAnchor:[9,9]
});

const locationButton=L.control({position:'bottomright'});
locationButton.onAdd=function(){
const b=L.DomUtil.create('button');
b.innerHTML='📍 My Location';
b.style.cssText='background:#07883d;color:white;border:0;border-radius:8px;padding:12px;font-size:15px;cursor:pointer';
L.DomEvent.disableClickPropagation(b);
b.onclick=getLocation;
return b;
};
locationButton.addTo(map);

function getLocation(){
if(!navigator.geolocation){
alert('Aapke browser mein GPS available nahi hai.');
return;
}
document.getElementById('status').textContent='GPS location mil rahi hai...';
navigator.geolocation.getCurrentPosition(pos=>{
const lat=pos.coords.latitude;
const lon=pos.coords.longitude;
if(lat<23.5||lat>37.2||lon<60.8||lon>77.9){
alert('Aapki location Pakistan map ki hudood se bahar hai.');
return;
}
if(gpsMarker)map.removeLayer(gpsMarker);
gpsMarker=L.marker([lat,lon],{icon:gpsIcon})
.addTo(map).bindPopup('Aapki live GPS location').openPopup();
map.setView([lat,lon],16);
document.getElementById('status').textContent='GPS location mil gayi.';
},()=>{
document.getElementById('status').textContent='GPS nahi mila. Browser ki Location permission on karein.';
},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}

async function findPlace(){
const q=document.getElementById('search').value.trim();
if(!q){alert('Shehar ya jagah ka naam likhein.');return;}
document.getElementById('status').textContent='Jagah search ho rahi hai...';
try{
const url='https://nominatim.openstreetmap.org/search?format=json&countrycodes=pk&limit=5&q='+encodeURIComponent(q);
const response=await fetch(url);
const results=await response.json();
if(!results.length){
document.getElementById('status').textContent='Jagah nahi mili. Doosra naam try karein.';
return;
}
const place=results.find(p=>{
const lat=Number(p.lat),lon=Number(p.lon);
return lat>=23.5&&lat<=37.2&&lon>=60.8&&lon<=77.9;
});
if(!place){
document.getElementById('status').textContent='Pakistan mein yeh jagah nahi mili.';
return;
}
const point=[Number(place.lat),Number(place.lon)];
if(searchMarker)map.removeLayer(searchMarker);
searchMarker=L.marker(point).addTo(map).bindPopup(place.display_name).openPopup();
map.setView(point,15);
document.getElementById('status').textContent='Search result: '+place.display_name;
}catch(e){
document.getElementById('status').textContent='Internet check karein aur dobara search karein.';
}
}

document.getElementById('search').addEventListener('keydown',e=>{
if(e.key==='Enter')findPlace();
});
</script>
</body>
</html>
