
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pakistan HD Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7}
#top{padding:10px;background:#fff;position:relative;z-index:1000}
h3{margin:0 0 10px;text-align:center}
#search{display:flex;gap:6px;margin-bottom:8px}
input{width:100%;min-width:0;padding:11px;border:1px solid #aaa;border-radius:7px;font-size:15px}
button{padding:10px;border:0;border-radius:7px;background:#087bda;color:white;font-size:14px;cursor:pointer}
.buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#status{font-size:13px;margin-top:7px;text-align:center;color:#333}
#map{height:calc(100vh - 155px);width:100%}
.zoom{position:absolute;right:12px;top:175px;z-index:1000;display:flex;flex-direction:column;gap:5px}
.zoom button{font-size:24px;width:45px;height:45px;padding:0;background:#fff;color:#222;border:1px solid #aaa}
</style>
</head>

<body>
<div id="top">
<h3>Pakistan HD Map</h3>

<div id="search">
<input id="place" placeholder="Shehar, ilaqa ya jagah search karein">
<button onclick="searchKaro()">Search</button>
</div>

<div class="buttons">
<button onclick="roadMap()">Road / Galiyan</button>
<button onclick="satMap()">Satellite HD</button>
<button onclick="hybridMap()">Satellite + Naam</button>
<button onclick="ghar()">Pakistan</button>
<button onclick="asliGPS()">Live GPS</button>
</div>

<div id="status">Map load ho raha hai...</div>
</div>

<div class="zoom">
<button onclick="zoomIn()">+</button>
<button onclick="zoomOut()">−</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const pakistan=L.latLngBounds([23.4,60.5],[37.2,77.9]);

const map=L.map('map',{
center:[30.3753,69.3451],
zoom:6,
minZoom:3,
maxZoom:19,
maxBounds:pakistan,
maxBoundsViscosity:0.5,
zoomControl:false
});

const road=L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19,attribution:'© OpenStreetMap contributors'}
);

const sat=L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:19,attribution:'Imagery © Esri'}
);

const labels=L.tileLayer(
'https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',
{subdomains:'abcd',maxZoom:19,attribution:'Labels © CARTO'}
);

let marker=null;
let gpsMarker=null;
let gpsCircle=null;
let watch=null;
let followGPS=false;

sat.addTo(map);

function status(msg){
document.getElementById('status').textContent=msg;
}

function zoomIn(){
map.zoomIn(1);
}

function zoomOut(){
map.zoomOut(1);
}

function roadMap(){
map.removeLayer(sat);
map.removeLayer(labels);
if(!map.hasLayer(road)) road.addTo(map);
status('Road aur galiyon ka map');
}

function satMap(){
map.removeLayer(road);
map.removeLayer(labels);
if(!map.hasLayer(sat)) sat.addTo(map);
status('Satellite map');
}

function hybridMap(){
map.removeLayer(road);
if(!map.hasLayer(sat)) sat.addTo(map);
if(!map.hasLayer(labels)) labels.addTo(map);
status('Satellite aur available naam');
}

function ghar(){
followGPS=false;
map.fitBounds(pakistan,{animate:false});
status('Pakistan ka map');
}

async function searchKaro(){
const q=document.getElementById('place').value.trim();

if(!q){
status('Pehle jagah ka naam likhein');
return;
}

followGPS=false;
status('Jagah search ho rahi hai...');

try{
const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pk&q='+encodeURIComponent(q);
const response=await fetch(url);
const data=await response.json();

if(!data.length){
status('Jagah nahi mili. Doosra naam try karein');
return;
}

const p=L.latLng(Number(data[0].lat),Number(data[0].lon));

if(!pakistan.contains(p)){
status('Yeh jagah Pakistan ki map boundary se bahar hai');
return;
}

if(marker) map.removeLayer(marker);

marker=L.marker(p).addTo(map)
.bindPopup(data[0].display_name)
.openPopup();

followGPS=false;
map.setView(p,17,{animate:false});
status('Search result: '+data[0].display_name);

}catch(e){
status('Search nahi ho saki. Internet check karein');
}
}

document.getElementById('place').addEventListener('keydown',function(e){
if(e.key==='Enter') searchKaro();
});

function asliGPS(){
if(!navigator.geolocation){
status('Is browser mein GPS available nahi');
return;
}

followGPS=true;
status('GPS location ka intezar hai...');

navigator.geolocation.getCurrentPosition(
function(pos){
updateGPS(pos);
if(watch===null){
watch=navigator.geolocation.watchPosition(
updateGPS,
errorGPS,
{enableHighAccuracy:true,maximumAge:0,timeout:20000}
);
}
},
errorGPS,
{enableHighAccuracy:true,maximumAge:0,timeout:20000}
);
}

function updateGPS(pos){
const p=L.latLng(pos.coords.latitude,pos.coords.longitude);

if(!pakistan.contains(p)){
followGPS=false;
status('GPS location Pakistan map boundary se bahar hai');
return;
}

if(!gpsMarker){
gpsMarker=L.circleMarker(p,{
radius:8,color:'#ffffff',weight:3,
fillColor:'#087bda',fillOpacity:1
}).addTo(map).bindPopup('Aap ki GPS location');
}else{
gpsMarker.setLatLng(p);
}

if(!gpsCircle){
gpsCircle=L.circle(p,{
radius:pos.coords.accuracy,
color:'#087bda',fillColor:'#087bda',fillOpacity:0.12
}).addTo(map);
}else{
gpsCircle.setLatLng(p);
gpsCircle.setRadius(pos.coords.accuracy);
}

if(followGPS){
map.setView(p,18,{animate:false});
status('GPS accuracy taqreeban '+Math.round(pos.coords.accuracy)+' meter');
}
}

function errorGPS(err){
followGPS=false;

if(err.code===1){
status('GPS permission allow karein');
}else if(err.code===2){
status('GPS location nahi mil rahi');
}else{
status('GPS timeout. Dobara Live GPS dabayein');
}
}

map.on('dragstart',function(){
followGPS=false;
});

map.whenReady(function(){
status('Pakistan map tayyar hai');
});
</script>
</body>
</html>
