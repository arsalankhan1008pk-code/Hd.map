<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan HD Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif}
header{background:#07883d;color:white;text-align:center;padding:14px;font-size:23px;font-weight:bold}
.search{display:flex;gap:7px;padding:10px}
input{flex:1;min-width:0;padding:12px;border:1px solid #aaa;border-radius:7px;font-size:15px}
button{padding:11px;background:#07883d;color:white;border:0;border-radius:7px;font-size:15px}
#map{height:calc(100dvh - 125px);width:100%;background:#e8eee8}
#status{font-size:13px;padding:8px 10px;color:#333;min-height:32px}
</style>
</head>
<body>
<header>Pakistan HD Map</header>
<div class="search">
<input id="search" placeholder="Shehar ya jagah search karein">
<button id="searchButton" type="button">Search</button>
</div>
<div id="map"></div>
<div id="status">Pakistan map</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{
zoomControl:true,
maxBounds:[[23,60],[37.8,78.5]],
maxBoundsViscosity:0.8
}).setView([30.3753,69.3451],5);

const normalMap=L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}
).addTo(map);

const satelliteMap=L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:19,attribution:'Tiles &copy; Esri'}
);

L.control.layers({
'Normal Road Map':normalMap,
'Satellite View':satelliteMap
},null,{position:'topright',collapsed:false}).addTo(map);

let gpsMarker=null;
let searchMarker=null;
let searching=false;

function status(text){
document.getElementById('status').textContent=text;
}

const gpsIcon=L.divIcon({
className:'',
html:'<div style="width:18px;height:18px;background:#1677ff;border:4px solid white;border-radius:50%;box-shadow:0 0 8px #555"></div>',
iconSize:[18,18],
iconAnchor:[9,9]
});

const gpsControl=L.control({position:'bottomright'});
gpsControl.onAdd=function(){
const b=L.DomUtil.create('button');
b.textContent='📍 My Location';
L.DomEvent.disableClickPropagation(b);
L.DomEvent.on(b,'click',getLocation);
return b;
};
gpsControl.addTo(map);

function getLocation(){
if(!navigator.geolocation){status('GPS available nahi hai.');return;}
status('GPS location mil rahi hai...');
navigator.geolocation.getCurrentPosition(pos=>{
const lat=pos.coords.latitude,lon=pos.coords.longitude;
if(lat<23.5||lat>37.2||lon<60.8||lon>77.9){status('GPS location Pakistan se bahar hai.');return;}
if(gpsMarker)map.removeLayer(gpsMarker);
gpsMarker=L.marker([lat,lon],{icon:gpsIcon}).addTo(map);
map.setView([lat,lon],16);
status('GPS location mil gayi.');
},()=>status('GPS nahi mila. Location permission check karein.'),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}

async function findPlace(){
const input=document.getElementById('search');
const q=input.value.trim();
if(!q||searching)return;

searching=true;
const btn=document.getElementById('searchButton');
btn.disabled=true;
status('Search ho rahi hai...');

try{
const url='https://nominatim.openstreetmap.org/search?format=json&countrycodes=pk&limit=10&q='+encodeURIComponent(q);
const response=await fetch(url);
if(!response.ok)throw Error('Search service error');

const results=await response.json();
const place=results.find(p=>{
const lat=Number(p.lat),lon=Number(p.lon);
return lat>=23.5&&lat<=37.2&&lon>=60.8&&lon<=77.9;
});

if(!place){status('Jagah nahi mili. Doosra naam try karein.');return;}

const point=[Number(place.lat),Number(place.lon)];
if(searchMarker)map.removeLayer(searchMarker);
searchMarker=L.marker(point).addTo(map);
map.flyTo(point,15,{duration:1});
status('Jagah mil gayi: '+place.display_name);
}catch(e){
status('Search service nahi chal rahi. Internet check karein.');
}finally{
searching=false;
btn.disabled=false;
}
}

document.getElementById('searchButton').onclick=findPlace;
document.getElementById('search').onkeydown=function(e){
if(e.key==='Enter'){
e.preventDefault();
findPlace();
}
};
</script>
</body>
</html>
