
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pakistan HD Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}
body{overflow:hidden;background:#fff}
header{height:48px;display:flex;align-items:center;justify-content:center}
h1{font-size:20px;color:#16833b;margin:0}
#searchbar{height:52px;padding:7px;display:flex;gap:6px}
#place{flex:1;min-width:0;border:1px solid #aaa;border-radius:7px;padding:0 9px;font-size:14px}
button{border:0;border-radius:7px;background:#16833b;color:#fff;font-weight:bold;padding:0 10px;min-height:36px}
#map{height:calc(100dvh - 130px);width:100%;background:#e7ece4}
#status{height:30px;padding:7px 9px;font-size:12px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{position:absolute;right:10px;top:115px;z-index:1000;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;background:#fff;color:#222;border:1px solid #aaa;font-size:24px;padding:0}
.leaflet-control-attribution{font-size:9px!important}
</style>
</head>
<body>
<header><h1>Pakistan HD Map</h1></header>
<div id="searchbar">
<input id="place" type="search" placeholder="Search city, road or street">
<button id="searchBtn">Search</button>
<button id="gpsBtn">Live GPS</button>
</div>
<div id="map"></div>
<div class="zoom">
<button id="plus" aria-label="Zoom in">+</button>
<button id="minus" aria-label="Zoom out">−</button>
<button id="pakBtn" aria-label="Pakistan view">PK</button>
</div>
<div id="status">Loading Pakistan map...</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
"use strict";
const status=document.getElementById("status");
const bounds=L.latLngBounds([[23.4,60.5],[37.2,77.9]]);
const map=L.map("map",{
center:[30.3753,69.3451],
zoom:6,minZoom:5,maxZoom:19,
maxBounds:bounds,maxBoundsViscosity:0.8,
zoomControl:false,zoomAnimation:false,
fadeAnimation:false,markerZoomAnimation:false
});
const roads=L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{maxZoom:19,updateWhenIdle:true,updateWhenZooming:false,keepBuffer:3,
attribution:"&copy; OpenStreetMap contributors"}
).addTo(map);
let gpsWatch=null,gpsMarker=null,gpsCircle=null,searchMarker=null;
let followGPS=false;
function message(text){status.textContent=text;}
function zoomIn(){followGPS=false;map.zoomIn(1,{animate:false});}
function zoomOut(){followGPS=false;map.zoomOut(1,{animate:false});}
function showPakistan(){
followGPS=false;
map.fitBounds(bounds,{padding:[8,8],animate:false});
message("Pakistan map");
}
document.getElementById("plus").onclick=zoomIn;
document.getElementById("minus").onclick=zoomOut;
document.getElementById("pakBtn").onclick=showPakistan;
map.on("dragstart",()=>{followGPS=false;});
roads.on("load",()=>message("Pakistan map ready"));
roads.on("tileerror",()=>message("Map tiles load nahi ho rahi. Internet check karein."));
function insidePakistan(lat,lon){
return lat>=23.4&&lat<=37.2&&lon>=60.5&&lon<=77.9;
}
async function searchPlace(){
const query=document.getElementById("place").value.trim();
if(!query){message("Shehar, road ya gali ka naam likhein.");return;}
followGPS=false;
message("Search ho rahi hai...");
try{
const url="https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=pk&limit=5&q="+encodeURIComponent(query);
const response=await fetch(url);
if(!response.ok)throw Error("Search failed");
const results=await response.json();
const place=results.find(item=>insidePakistan(Number(item.lat),Number(item.lon)));
if(!place){message("Pakistan mein yeh jagah nahi mili.");return;}
const point=L.latLng(Number(place.lat),Number(place.lon));
if(searchMarker)map.removeLayer(searchMarker);
searchMarker=L.circleMarker(point,{
radius:6,color:"#fff",weight:2,fillColor:"#1769ff",fillOpacity:1
}).addTo(map);
searchMarker.bindPopup(place.display_name).openPopup();
map.setView(point,Math.max(map.getZoom(),16),{animate:false});
message("Jagah mil gayi: "+place.display_name);
}catch(error){
message("Search nahi ho saki. Internet check karke dobara try karein.");
}
}
document.getElementById("searchBtn").onclick=searchPlace;
document.getElementById("place").addEventListener("keydown",event=>{
if(event.key==="Enter")searchPlace();
});
function startGPS(){
if(!navigator.geolocation){
message("Is browser mein GPS available nahi hai.");return;
}
if(gpsWatch!==null){
followGPS=true;
if(gpsMarker)map.setView(gpsMarker.getLatLng(),18,{animate:false});
message("Live GPS on hai.");return;
}
followGPS=true;
message("GPS location mil rahi hai...");
gpsWatch=navigator.geolocation.watchPosition(position=>{
const lat=position.coords.latitude;
const lon=position.coords.longitude;
if(!insidePakistan(lat,lon)){
message("GPS Pakistan map boundaries se bahar hai.");return;
}
const point=L.latLng(lat,lon);
const accuracy=position.coords.accuracy||30;
if(!gpsMarker){
gpsMarker=L.circleMarker(point,{
radius:7,color:"#fff",weight:3,fillColor:"#1683ff",fillOpacity:1
}).addTo(map).bindPopup("Aap ki live GPS location");
gpsCircle=L.circle(point,{
radius:accuracy,color:"#1683ff",weight:1,fillOpacity:0.12
}).addTo(map);
}else{
gpsMarker.setLatLng(point);
gpsCircle.setLatLng(point);
gpsCircle.setRadius(accuracy);
}
if(followGPS)map.setView(point,18,{animate:false});
message("Live GPS on. Accuracy taqreeban "+Math.round(accuracy)+" meter.");
},error=>{
gpsWatch=null;
if(error.code===1)message("Location permission allow karein.");
else if(error.code===3)message("GPS timeout. Dobara Live GPS dabayein.");
else message("GPS nahi mila. Phone ki Location on karein.");
},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}
document.getElementById("gpsBtn").onclick=startGPS;
map.whenReady(()=>setTimeout(()=>map.invalidateSize(),200));
window.addEventListener("resize",()=>map.invalidateSize());
})();
</script>
</body>
</html>
