
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan HD Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif}
header{background:#087443;color:white;text-align:center;padding:15px;font-size:21px}
#map{height:calc(100vh - 54px);width:100%}
</style>
</head>
<body>
<header>Pakistan HD Map</header>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="index.js"></script>
</body>
</html>

const map = L.map('map', {
  zoomControl: true,
  minZoom: 5,
  maxZoom: 19
}).setView([30.3753, 69.3451], 6.5);

L.tileLayer(
  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }
).addTo(map);
